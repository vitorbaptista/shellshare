version: "3.8"

services:
  shellshare:
    build: .
    ports:
      - "4000:4000"
    environment:
      - SECRET_KEY_BASE=dev_secret_key_base_that_is_at_least_64_bytes_long_for_development
      - PHX_HOST=localhost
      - PORT=4000
    restart: unless-stopped

  # Development service with live reload
  dev:
    image: elixir:1.17
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
    command: >
      sh -c "mix local.hex --force &&
             mix local.rebar --force &&
             mix deps.get &&
             mix phx.server"
    profiles:
      - dev
