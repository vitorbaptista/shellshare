name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.15'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build assets
        run: npm run postinstall

      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/shellshare_test
