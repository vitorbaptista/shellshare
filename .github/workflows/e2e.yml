name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

# The suite only builds and tests this repo's own source. Naming the scope
# here keeps a compromised third-party action (or a build script from a PR)
# from inheriting a write-capable token.
permissions:
  contents: read

jobs:
  # Everything else here builds on stable, so `rust-version` is a claim
  # nothing tests - which is how it came to be three years out of date.
  # Checking it costs one job and turns "we think this still builds on the
  # oldest toolchain we advertise" into something we know.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets

  e2e:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            workers: 10
          # macOS runners have 3 cores; 10 workers oversubscribes them
          # enough that viewer connects flake on 5-15s timeouts
          - os: macos-latest
            workers: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust binary
        run: cargo build --release

      - name: Install Node (the agent reader needs >=22 for WebSocket)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: |
          cd e2e
          uv run playwright install-deps chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -n ${{ matrix.workers }}
        env:
          CI: true
