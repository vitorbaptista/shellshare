name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

# The suite only builds and tests this repo's own source. Naming the scope
# here keeps a compromised third-party action (or a build script from a PR)
# from inheriting a write-capable token.
permissions:
  contents: read

jobs:
  e2e:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            workers: 10
          # macOS runners have 3 cores; 10 workers oversubscribes them
          # enough that viewer connects flake on 5-15s timeouts
          - os: macos-latest
            workers: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust binary
        run: cargo build --release

      - name: Install Node (the agent reader needs >=22 for WebSocket)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: |
          cd e2e
          uv run playwright install-deps chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -n ${{ matrix.workers }}
        env:
          CI: true
