name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  e2e:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            workers: 10
          # macOS runners have 3 cores; 10 workers oversubscribes them
          # enough that Socket.IO joins flake on 5-15s timeouts
          - os: macos-latest
            workers: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust binary
        run: cargo build --release

      - name: Start server
        run: |
          ./target/release/shellshare server --host 0.0.0.0 --port 3000 &
          sleep 2

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is up after $i attempt(s)."
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not become ready after 30 attempts."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: |
          cd e2e
          uv run playwright install-deps chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -n ${{ matrix.workers }}
        env:
          CI: true
