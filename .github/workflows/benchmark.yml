name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  benchmark:
    # Informational only: shared runners are too noisy for hard latency
    # thresholds. Results land in the job summary and as an artifact, so
    # regressions show up when comparing runs.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust binary
        run: cargo build --release

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Run benchmark
        run: |
          cd e2e
          uv run python benchmark.py --label "${GITHUB_SHA::8}" --out bench-results.json | tee bench-output.txt
        env:
          CI: true

      - name: Publish results to job summary
        run: |
          {
            echo "## Benchmark results"
            echo '```'
            cat e2e/bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: e2e/bench-results.json
