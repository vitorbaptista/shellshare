name: E2E Tests (Docker Compose)

on:
  push:
    branches: [master, upgrade-node-lts]
  pull_request:
    branches: [master, upgrade-node-lts]

jobs:
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose build
          docker compose run --rm node ls -la /shellshare/public/stylesheet/
          docker compose run --rm node ls -la /shellshare/public/javascript/
          docker compose up -d

      - name: Wait for server
        run: |
          server_up=false
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is up after $i attempt(s)."
              server_up=true
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          if [ "$server_up" = false ]; then
            echo "Server did not become ready after 30 attempts."
            docker compose logs
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -v
        env:
          CI: true

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
