name: E2E Tests (Windows)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust server
        run: cargo build --release

      - name: Start server
        shell: pwsh
        run: |
          # Start the server in a new process that stays alive
          # Use 127.0.0.1 instead of 0.0.0.0 for Windows compatibility
          Start-Process -FilePath ".\target\release\shellshare.exe" -ArgumentList "server", "--host", "127.0.0.1", "--port", "3000" -RedirectStandardOutput "server.log" -RedirectStandardError "server-error.log"
          Start-Sleep -Seconds 5
          Write-Host "Server process started"

      - name: Wait for server
        shell: pwsh
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "Server is up after $elapsed seconds"
                exit 0
              }
            } catch {
              Write-Host "Waiting for server... ($elapsed s)"
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Host "Server did not start within $timeout seconds"
          Write-Host "=== Server log ==="
          if (Test-Path "server.log") { Get-Content "server.log" } else { Write-Host "No server.log found" }
          Write-Host "=== Server error log ==="
          if (Test-Path "server-error.log") { Get-Content "server-error.log" } else { Write-Host "No server-error.log found" }
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -v
        env:
          CI: true
