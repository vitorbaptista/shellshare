name: E2E Tests (Windows)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and Start MongoDB
        shell: pwsh
        run: |
          # Download MongoDB
          $mongoUrl = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.28-signed.msi"
          $msiPath = "$env:TEMP\mongodb.msi"
          Write-Host "Downloading MongoDB..."
          Invoke-WebRequest -Uri $mongoUrl -OutFile $msiPath

          # Install MongoDB to default location
          Write-Host "Installing MongoDB..."
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/quiet", "/qn", "ADDLOCAL=all" -Wait

          # Define MongoDB path
          $mongoPath = "C:\Program Files\MongoDB\Server\7.0\bin"

          # Verify installation
          Write-Host "Checking MongoDB installation..."
          Get-ChildItem "C:\Program Files\MongoDB" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "mongod.exe" } | ForEach-Object { Write-Host "Found: $($_.FullName)" }

          # Create data directory
          New-Item -ItemType Directory -Force -Path "C:\data\db"

          # Start MongoDB
          Write-Host "Starting MongoDB..."
          Start-Process -FilePath "$mongoPath\mongod.exe" -ArgumentList "--dbpath", "C:\data\db" -NoNewWindow

          # Wait for MongoDB to be ready
          Start-Sleep -Seconds 10
          Write-Host "MongoDB started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build assets
        run: npx gulp build:production

      - name: Start server
        shell: pwsh
        run: |
          # Create a PowerShell script to start the server
          @'
          $env:MONGO_URL = "mongodb://localhost:27017/shellshare_test"
          $env:PORT = "3000"
          node app.js 2>&1 | Tee-Object -FilePath "server.log"
          '@ | Out-File -FilePath "start-server.ps1" -Encoding UTF8

          # Start the server in a new PowerShell process that stays alive
          Start-Process pwsh.exe -ArgumentList "-ExecutionPolicy", "Bypass", "-File", "start-server.ps1" -WorkingDirectory $PWD
          Start-Sleep -Seconds 3
          Write-Host "Server process started"

      - name: Wait for server
        shell: pwsh
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "Server is up after $elapsed seconds"
                exit 0
              }
            } catch {
              Write-Host "Waiting for server... ($elapsed s)"
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Host "Server did not start within $timeout seconds"
          Write-Host "=== Server log ==="
          if (Test-Path "server.log") { Get-Content "server.log" } else { Write-Host "No server.log found" }
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -v
        env:
          CI: true
