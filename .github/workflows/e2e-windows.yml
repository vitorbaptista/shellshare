name: E2E Tests (Windows)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust server
        run: cargo build --release

      - name: Start server
        shell: pwsh
        run: |
          # Start the server as a background job
          # Use 127.0.0.1 instead of 0.0.0.0 for Windows compatibility
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & ".\target\release\shellshare.exe" server --host "127.0.0.1" --port "3000"
          }
          Start-Sleep -Seconds 5
          Write-Host "Server job started with ID: $($job.Id)"
          # Check if job is still running
          $jobState = (Get-Job -Id $job.Id).State
          Write-Host "Job state: $jobState"
          if ($jobState -eq "Failed") {
            Write-Host "Job failed! Output:"
            Receive-Job -Id $job.Id
            exit 1
          }

      - name: Wait for server
        shell: pwsh
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            # Check if process is still running
            $proc = Get-Process -Name "shellshare" -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Host "ERROR: shellshare process not found!"
              Write-Host "=== Job output ==="
              $jobs = Get-Job
              foreach ($job in $jobs) {
                Write-Host "Job $($job.Id) state: $($job.State)"
                Receive-Job -Id $job.Id
              }
              exit 1
            }
            
            # Check if port is listening
            $netstat = netstat -an | Select-String ":3000"
            Write-Host "Port 3000 status: $netstat"
            
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "Server is up after $elapsed seconds"
                exit 0
              }
            } catch {
              Write-Host "Waiting for server... ($elapsed s) - Error: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Host "Server did not start within $timeout seconds"
          Write-Host "=== Job output ==="
          $jobs = Get-Job
          foreach ($job in $jobs) {
            Write-Host "Job $($job.Id) state: $($job.State)"
            Receive-Job -Id $job.Id
          }
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -v
        env:
          CI: true
