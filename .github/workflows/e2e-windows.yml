name: E2E Tests (Windows)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and Start MongoDB
        shell: pwsh
        run: |
          # Download MongoDB
          $mongoUrl = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.28-signed.msi"
          $msiPath = "$env:TEMP\mongodb.msi"
          Write-Host "Downloading MongoDB..."
          Invoke-WebRequest -Uri $mongoUrl -OutFile $msiPath

          # Install MongoDB
          Write-Host "Installing MongoDB..."
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/quiet", "/qn", "INSTALLLOCATION=C:\MongoDB", "ADDLOCAL=all" -Wait

          # Create data directory
          New-Item -ItemType Directory -Force -Path "C:\data\db"

          # Start MongoDB
          Write-Host "Starting MongoDB..."
          Start-Process -FilePath "C:\MongoDB\bin\mongod.exe" -ArgumentList "--dbpath", "C:\data\db" -NoNewWindow

          # Wait for MongoDB to be ready
          Start-Sleep -Seconds 5
          Write-Host "MongoDB started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build assets
        run: npx gulp build:production

      - name: Start server
        shell: pwsh
        run: |
          # Create a batch file to start the server with environment variables
          @"
          @echo off
          set MONGO_URL=mongodb://localhost:27017/shellshare_test
          set PORT=3000
          node app.js
          "@ | Out-File -FilePath "start-server.bat" -Encoding ASCII
          # Run the batch file in a new process
          Start-Process cmd.exe -ArgumentList "/c", "start-server.bat" -WindowStyle Hidden

      - name: Wait for server
        shell: pwsh
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "Server is up after $elapsed seconds"
                exit 0
              }
            } catch {
              Write-Host "Waiting for server... ($elapsed s)"
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Host "Server did not start within $timeout seconds"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          cd e2e
          uv sync

      - name: Install Playwright browsers
        run: |
          cd e2e
          uv run playwright install chromium

      - name: Run E2E tests
        run: |
          cd e2e
          uv run pytest -v
        env:
          CI: true
