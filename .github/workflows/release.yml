name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Default for the build and test jobs, which only compile this repo's source.
# The three jobs that publish something (docker, release, publish-npm) each
# override this with the narrower scope they actually need - a job-level block
# replaces this one wholesale rather than adding to it.
permissions:
  contents: read

jobs:
  # Gate the build on E2E, but only for tags. A push to main already runs
  # both suites through their own workflows (e2e.yml and e2e-windows.yml
  # trigger on `push: main` themselves), so calling them here as well ran
  # the whole suite twice for every push - twice the wall clock, and twice
  # the exposure to a flake, which is how the same green commit produced one
  # red run and one passing one. A tag has to run them inline, because
  # neither workflow triggers on tags.
  e2e-linux:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/e2e.yml

  e2e-windows:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/e2e-windows.yml

  # Pass 1: Build bare binaries (no embedding) for all platforms.
  #
  # On a branch this is the only thing that compiles musl and x86_64 macOS,
  # runs the embedding pass, and builds the Docker image - the E2E workflows
  # only ever build natively for their own runner - so it stays as a smoke
  # test that catches a cross-compile break before a tag exists to waste.
  build-bare:
    needs: [e2e-linux, e2e-windows]
    # A skipped `needs` would skip this job by default, so decide explicitly:
    # run unless a gate actually failed. The last clause drops the branch half
    # of a release push - release.sh pushes main and the tag atomically, which
    # fires two runs of this workflow, and the tag one is the one that
    # publishes.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && !(github.ref_type == 'branch'
               && startsWith(github.event.head_commit.message, 'chore: release')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: bare-linux-x86_64
            binary: shellshare
          # Pinned because GitHub ships no `ubuntu-latest-arm` label
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: bare-linux-aarch64
            binary: shellshare
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bare-windows-x86_64
            binary: shellshare.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bare-macos-x86_64
            binary: shellshare
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bare-macos-aarch64
            binary: shellshare

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install musl tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build bare binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload bare binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 1

  # Pass 2: Build with embedded binaries from Pass 1
  build-embedded:
    needs: build-bare
    # Skipping propagates down the whole chain, not just one level: with the
    # e2e gate skipped on a branch, this was skipped too even though
    # build-bare had succeeded, which quietly cost the branch smoke test its
    # embedding and Docker coverage. Decide from this job's own needs.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: shellshare-linux-x86_64
            binary: shellshare
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: shellshare-linux-aarch64
            binary: shellshare
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: shellshare-windows-x86_64
            binary: shellshare.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: shellshare-macos-x86_64
            binary: shellshare
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: shellshare-macos-aarch64
            binary: shellshare

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install musl tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Download all bare binaries from Pass 1
      - name: Download Linux bare binary
        uses: actions/download-artifact@v8
        with:
          name: bare-linux-x86_64
          path: binaries-temp/linux

      - name: Download Linux ARM bare binary
        uses: actions/download-artifact@v8
        with:
          name: bare-linux-aarch64
          path: binaries-temp/linux-arm

      - name: Download Windows bare binary
        uses: actions/download-artifact@v8
        with:
          name: bare-windows-x86_64
          path: binaries-temp/windows

      - name: Download macOS Intel bare binary
        uses: actions/download-artifact@v8
        with:
          name: bare-macos-x86_64
          path: binaries-temp/macos-intel

      - name: Download macOS ARM bare binary
        uses: actions/download-artifact@v8
        with:
          name: bare-macos-aarch64
          path: binaries-temp/macos-arm

      # Organize binaries with expected names
      - name: Organize binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p binaries
          cp binaries-temp/linux/shellshare binaries/shellshare-linux-x86_64
          cp binaries-temp/linux-arm/shellshare binaries/shellshare-linux-aarch64
          cp binaries-temp/windows/shellshare.exe binaries/shellshare-windows-x86_64.exe
          cp binaries-temp/macos-intel/shellshare binaries/shellshare-macos-x86_64
          cp binaries-temp/macos-arm/shellshare binaries/shellshare-macos-aarch64
          ls -la binaries/

      - name: Organize binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item binaries-temp/linux/shellshare binaries/shellshare-linux-x86_64
          Copy-Item binaries-temp/linux-arm/shellshare binaries/shellshare-linux-aarch64
          Copy-Item binaries-temp/windows/shellshare.exe binaries/shellshare-windows-x86_64.exe
          Copy-Item binaries-temp/macos-intel/shellshare binaries/shellshare-macos-x86_64
          Copy-Item binaries-temp/macos-arm/shellshare binaries/shellshare-macos-aarch64
          Get-ChildItem binaries/

      - name: Build with embedded binaries
        run: cargo build --release --target ${{ matrix.target }} --features embed-binaries

      - name: Upload embedded binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 7

  # Build and push Docker image to GHCR
  docker:
    needs: build-embedded
    # Same reason as build-embedded: the skip would otherwise reach this far.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Linux embedded binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-linux-x86_64
          path: .

      - name: Make binary executable
        run: chmod +x shellshare

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ghcr.io/vitorbaptista/shellshare:latest
            ghcr.io/vitorbaptista/shellshare:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/vitorbaptista/shellshare:{0}', github.ref_name) || '' }}

  # Create GitHub release with all binaries
  release:
    needs: build-embedded
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-linux-x86_64
          path: release/linux

      - name: Download Linux ARM binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-linux-aarch64
          path: release/linux-arm

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-windows-x86_64
          path: release/windows

      - name: Download macOS Intel binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-macos-x86_64
          path: release/macos-intel

      - name: Download macOS ARM binary
        uses: actions/download-artifact@v8
        with:
          name: shellshare-macos-aarch64
          path: release/macos-arm

      - name: Prepare release assets
        run: |
          mkdir -p assets
          cp release/linux/shellshare assets/shellshare-linux-x86_64
          cp release/linux-arm/shellshare assets/shellshare-linux-aarch64
          cp release/windows/shellshare.exe assets/shellshare-windows-x86_64.exe
          cp release/macos-intel/shellshare assets/shellshare-macos-x86_64
          cp release/macos-arm/shellshare assets/shellshare-macos-aarch64
          chmod +x assets/shellshare-linux-x86_64 assets/shellshare-linux-aarch64 assets/shellshare-macos-x86_64 assets/shellshare-macos-aarch64
          ls -la assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            assets/shellshare-linux-x86_64
            assets/shellshare-linux-aarch64
            assets/shellshare-windows-x86_64.exe
            assets/shellshare-macos-x86_64
            assets/shellshare-macos-aarch64
          generate_release_notes: true

  # Publish to npm so `npx shellshare` works: four platform packages carrying
  # the binaries (esbuild-style optionalDependencies, no postinstall) plus the
  # meta package with the launcher shim. Auth via npm Trusted Publishing (OIDC).
  publish-npm:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing needs npm >= 11.5; Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Download embedded binaries
        uses: actions/download-artifact@v8
        with:
          pattern: 'shellshare-*'
          path: npm-binaries

      - name: Stage npm packages
        run: node npm/scripts/prepare-packages.js "${GITHUB_REF_NAME#v}" npm-binaries dist-npm

      - name: Smoke-test the Linux package binary
        run: dist-npm/shellshare-linux-x64/bin/shellshare --version

      # Platform packages first so the meta package never points at versions
      # that don't exist yet. The shellshare-* glob skips the meta dir.
      - name: Publish platform packages
        run: |
          for dir in dist-npm/shellshare-*; do
            (cd "$dir" && npm publish --provenance --access public)
          done

      - name: Publish meta package
        run: cd dist-npm/shellshare && npm publish --provenance --access public
