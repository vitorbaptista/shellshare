name: Rust E2E Tests

on:
  push:
    branches: [ rust-server-rewrite ]
  pull_request:
    branches: [ master, rust-server-rewrite ]
    paths:
      - 'rust-server/**'
      - 'e2e/**'
      - '.github/workflows/rust-e2e.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-server/Cargo.lock') }}

      - name: Build Rust server
        working-directory: rust-server
        run: cargo build --release

      - name: Start Rust server
        working-directory: rust-server
        run: |
          ./target/release/shellshare server --port 3000 &
          echo $! > /tmp/server.pid
        env:
          RUST_LOG: info

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is up!"
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        working-directory: e2e
        run: uv sync

      - name: Install Playwright browsers
        working-directory: e2e
        run: uv run playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: e2e
        run: |
          # Run tests, allowing failures (we expect many to fail initially)
          uv run pytest -v --tb=short 2>&1 | tee test-output.txt || true
          
          # Show summary
          echo ""
          echo "=== TEST SUMMARY ==="
          grep -E "^(PASSED|FAILED|ERROR)" test-output.txt | sort | uniq -c || true
          echo ""
          
          # Extract pass/fail counts
          PASSED=$(grep -c "PASSED" test-output.txt || echo "0")
          FAILED=$(grep -c "FAILED" test-output.txt || echo "0")
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          
          # For now, don't fail the job - we expect failures
          # Once all tests pass, change this to fail on any test failure

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          # If we had logged to a file, show it here
