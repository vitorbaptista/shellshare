[project]
name = "shellshare-e2e"
version = "0.1.0"
description = "E2E black-box tests for Shellshare"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "playwright>=1.40.0",
    "pytest>=8.0.0",
    "requests>=2.34.2",
    # tomllib is stdlib only from 3.11; the manifest-lockstep test needs it
    "tomli>=2.0.0; python_version < '3.11'",
    "websocket-client>=1.9.0",
    "wsaccel>=0.6.7",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
