[package]
name = "fanout-loadgen"
version = "0.1.0"
edition = "2021"
description = "Viewer-swarm load generator for benchmark_fanout.py"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = 3
