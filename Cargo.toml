[package]
name = "shellshare"
version = "3.4.0"
edition = "2021"
description = "Live terminal broadcasting - server and client"
license = "Apache-2.0"
authors = ["Vitor Baptista"]
repository = "https://github.com/vitorbaptista/shellshare"
homepage = "https://shellshare.net"
readme = "README.md"
keywords = ["terminal", "broadcast", "shell", "live", "tty"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.75"

[features]
default = []
embed-binaries = []

[badges]
maintenance = { status = "passively-maintained" }

[[bin]]
name = "shellshare"
path = "src/main.rs"

[dependencies]
# Web framework (server)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# Static file embedding (server)
rust-embed = { version = "8", features = ["mime-guess", "axum"] }
mime_guess = "2"

# CLI
clap = { version = "4", features = ["derive", "env", "string"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL encoding/decoding
percent-encoding = "2.3"

# MAC address for default password (CLI)
mac_address = "1"

# Random room ID generation (CLI)
rand = "0.8"

# PTY for script mode (CLI)
portable-pty = "0.8"

# Ctrl+C handling (CLI)
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2.180"
term_size = "0.3.2"
signal-hook = "0.4.3"
hex = "0.4.3"
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
bytes = "1.11.1"
hmac = "0.12.1"
sha2 = "0.10.9"
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
aes-gcm = "0.10.3"
machine-uid = "0.6.0"
hkdf = "0.12.4"
dashmap = "6.2.1"
futures-util = { version = "0.3.32", default-features = false, features = ["std", "sink"] }

[profile.release]
lto = true
strip = true
opt-level = "z"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
