[package]
name = "shellshare"
version = "2.0.4"
edition = "2021"
description = "Live terminal broadcasting - server and client"
license = "Apache-2.0"
authors = ["Vitor Baptista"]
repository = "https://github.com/vitorbaptista/shellshare"
homepage = "https://shellshare.net"
readme = "README.md"
keywords = ["terminal", "broadcast", "shell", "live", "tty"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.75"

[features]
default = []
embed-binaries = []

[badges]
maintenance = { status = "passively-maintained" }

[[bin]]
name = "shellshare"
path = "src/main.rs"

[dependencies]
# Web framework (server)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# Static file embedding (server)
rust-embed = { version = "8", features = ["mime-guess", "axum"] }
mime_guess = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Socket.IO (server)
socketioxide = { version = "0.15", features = ["state"] }

# Base64 encoding
base64 = "0.22"

# URL encoding/decoding
percent-encoding = "2.3"
url = "2"

# HTTP client (CLI)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# MAC address for default password (CLI)
mac_address = "1"

# Random room ID generation (CLI)
rand = "0.8"

# PTY for script mode (CLI)
portable-pty = "0.8"

# Ctrl+C handling (CLI)
ctrlc = "3"
libc = "0.2.180"
term_size = "0.3.2"
signal-hook = "0.4.3"

[profile.release]
lto = true
strip = true
opt-level = "z"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
