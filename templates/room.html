<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">
<head>
  <title>shellshare - live terminal broadcast</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Shellshare allows you to broadcast your terminal live with a single command.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="shellshare: live terminal broadcast">
  <meta property="og:site_name" content="shellshare">
  <meta property="og:description" content="Shellshare allows you to broadcast your terminal live with a single command.">
  <meta property="og:image" content="https://shellshare.net/shellshare-og-image.png">
  <link rel="stylesheet" href="/stylesheet/vendor/ansi2html.css">
  <link rel="stylesheet" href="/stylesheet/room.css">
  <link id="favicon" rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="online">
        <span id="broadcast-status" class="broadcast-status offline"
              role="status" title="offline"><span
              id="broadcast-status-text" class="visually-hidden"
              >broadcaster offline</span></span>
        <span id="online-counter">0</span> user<span id="online-counter-plural">s</span> online
      </div>
      <h1 class="title">
        <a href="/"><span class="title-shell">shell</span><span class="title-share">share</span></a>
      </h1>
    </header>
    <main class="main">
      <div id="terminal">
        <button id="fullscreen-toggle" type="button" title="Fullscreen (f)" aria-label="Toggle fullscreen">
          <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
          <svg class="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
          </svg>
        </button>
      </div>
    </main>
    <footer>
      <p>shellshare is a free software (Apache License). Source code on <a href="https://github.com/vitorbaptista/shellshare">GitHub</a>.</p>
      <p>Made by <a href="https://vitorbaptista.com">Vitor Baptista</a>.</p>
    </footer>
  </div>
  <script src="/javascript/vendor/socket.io.min.js"></script>
  <script src="/javascript/vendor/term.js"></script>
  <script>
    (function () {
      'use strict';

      // Theme definitions injected by the server from themes.json
      var THEMES = {{THEMES_JSON}};
      // WebSocket only - the server rejects HTTP long-polling (its
      // engine.io polling path corrupts binary frames), and skipping
      // the polling-then-upgrade dance avoids its races entirely
      var socket = io({transports: ['websocket']});
      var room = window.location.pathname;
      var term;
      var currentSize = {};
      // Messages are binary: raw terminal bytes, decoded as one
      // continuous UTF-8 stream (sequences may split across messages)
      var decoder = new TextDecoder('utf-8');
      var joinedBefore = false;
      var onlineCounter = document.getElementById('online-counter');
      var onlineCounterPlural = document.getElementById('online-counter-plural');
      var broadcastStatus = document.getElementById('broadcast-status');
      var broadcastStatusText =
        document.getElementById('broadcast-status-text');
      var terminalContainer = document.getElementById('terminal');
      var fullscreenToggle = document.getElementById('fullscreen-toggle');
      var favicon = document.getElementById('favicon');

      // While the room is live the favicon's underscore cursor blinks:
      // alternate between the regular icon and one with the cursor
      // erased. Animated GIF favicons don't animate in Chrome/Safari,
      // so the swap is driven from here.
      var FAVICON_CURSOR_ON = '/favicon.png';
      var FAVICON_CURSOR_OFF = '/favicon-cursor-off.png';
      var faviconTimer = null;
      var faviconCursorOn = true;
      // Pre-fetch so the first swaps don't flicker through a blank icon
      new Image().src = FAVICON_CURSOR_OFF;

      function setFaviconBlink(blinking) {
        if (blinking && !faviconTimer) {
          faviconTimer = setInterval(function () {
            faviconCursorOn = !faviconCursorOn;
            favicon.href = faviconCursorOn ?
              FAVICON_CURSOR_ON : FAVICON_CURSOR_OFF;
          }, 600);
        } else if (!blinking && faviconTimer) {
          clearInterval(faviconTimer);
          faviconTimer = null;
          faviconCursorOn = true;
          favicon.href = FAVICON_CURSOR_ON;
        }
      }

      if (typeof Terminal !== 'undefined') {
        Terminal.bindKeys = function() {
          // Disable key capture - read-only terminal
        };
      }

      // Init terminal with a default size.
      onSize({cols: 80, rows: 30});

      // Join on every connect: socket.io reconnects by itself after a
      // network blip, but room membership is lost server-side, so a
      // viewer that doesn't re-join goes silently dead.
      //
      // The join must be confirmed, not fire-and-forget: a bare emit
      // can be lost (e.g. it reaches the server before the connection
      // handler finished registering events), and a viewer whose join
      // vanished would stare at an empty terminal forever. The server
      // answers every join with usersCount, re-joining is idempotent,
      // and the history catch-up is only sent for a socket's first
      // join - so emit and re-emit until confirmed.
      var joinConfirmed = false;
      var joinTimer = null;
      function joinUntilConfirmed() {
        joinTimer = null;
        if (joinConfirmed || !socket.connected) {
          return;
        }
        socket.emit('join', room);
        joinTimer = setTimeout(joinUntilConfirmed, 500);
      }
      socket.on('connect', function () {
        if (joinedBefore) {
          // The server replays the room history on join; start from a
          // clean terminal instead of appending a duplicate
          if (term) {
            term.destroy();
            term = null;
          }
          currentSize = {};
          decoder = new TextDecoder('utf-8');
          onSize({cols: 80, rows: 30});
        }
        joinedBefore = true;
        joinConfirmed = false;
        if (joinTimer) {
          clearTimeout(joinTimer);
        }
        joinUntilConfirmed();
      });
      socket.on('usersCount', function (onlineUsers) {
        joinConfirmed = true;
        onlineCounter.innerHTML = onlineUsers;
        if (onlineUsers == 1) {
          onlineCounterPlural.innerHTML = '';
        } else {
          onlineCounterPlural.innerHTML = 's';
        }
      });
      // Whether the broadcaster's client is attached to the room right
      // now (it pings even when idle, so "live" means the session is
      // open, not that output is flowing). The server reports the
      // current state on join and every transition afterwards.
      socket.on('broadcasting', function (live) {
        setBroadcastStatus(live ? 'online' : 'offline');
        setFaviconBlink(live);
      });
      // Our own connection is down: we can't know the broadcaster's
      // state, so report the session as offline until we rejoin
      socket.on('disconnect', function () {
        setBroadcastStatus('offline');
        setFaviconBlink(false);
      });

      function setBroadcastStatus(state) {
        broadcastStatus.title = state;
        broadcastStatus.className = 'broadcast-status ' + state;
        // A real (visually hidden) text node, not an aria-label:
        // role="status" live regions only announce content changes
        broadcastStatusText.textContent = 'broadcaster ' + state;
      }
      socket.on('message', function (message) {
        if (term && message) {
          term.write(decoder.decode(message, {stream: true}));
        }
      });
      socket.on('size', onSize);

      function onSize(size) {
        var sizeChanged;
        if (!size || !size.cols || !size.rows) {
          return;
        }

        sizeChanged = (currentSize.cols != size.cols ||
                       currentSize.rows != size.rows ||
                       currentSize.theme != size.theme);

        if (term && sizeChanged) {
          term.destroy();
        }

        if (typeof Terminal !== 'undefined' && (!term || sizeChanged)) {
          var options = {
            cols: size.cols,
            rows: size.rows,
            body: terminalContainer,
          };
          var theme = THEMES[size.theme];
          if (theme) {
            // term.js takes the 16 ANSI colors plus background and
            // foreground as the last two entries
            options.colors = theme.palette.concat([theme.background,
                                                   theme.foreground]);
            terminalContainer.style.backgroundColor = theme.background;
          }
          term = new Terminal(options);
          term.open();
        }

        currentSize = size;
        fitTerminal();
      }

      // Fullscreen: the `fullscreen` class on #terminal drives all
      // layout, so browsers without requestFullscreen on divs (iOS
      // Safari) still get a fill-the-page mode. The native API only
      // adds the OS chrome on top.
      function isFullscreen() {
        return terminalContainer.classList.contains('fullscreen');
      }

      function nativeFullscreenElement() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement || null;
      }

      function enterFullscreen() {
        terminalContainer.classList.add('fullscreen');
        var rfs = terminalContainer.requestFullscreen ||
                  terminalContainer.webkitRequestFullscreen;
        if (rfs) {
          // Older webkit doesn't return a promise
          var result = rfs.call(terminalContainer);
          if (result && result.catch) {
            result.catch(function () {});
          }
        }
        fitTerminal();
      }

      function exitFullscreen() {
        if (nativeFullscreenElement()) {
          var result = (document.exitFullscreen ||
                        document.webkitExitFullscreen).call(document);
          if (result && result.catch) {
            result.catch(function () {});
          }
        }
        terminalContainer.classList.remove('fullscreen');
        fitTerminal();
      }

      function toggleFullscreen() {
        if (isFullscreen()) {
          exitFullscreen();
        } else {
          enterFullscreen();
        }
      }

      // Scale the font so the broadcaster's cols×rows fill the screen.
      // term.js sizing is purely font-size driven and .terminal is
      // width: max-content, so its bounding box at the base size gives
      // the exact ratio to scale by.
      var MIN_FONT_PX = 7;
      var fitScheduled = false;

      function fitTerminal() {
        if (!term) {
          return;
        }
        var el = term.element;
        el.style.fontSize = '';
        if (!isFullscreen()) {
          return;
        }
        // The stylesheet's base size, measured with the inline
        // override cleared above
        var baseFont = parseFloat(getComputedStyle(el).fontSize) || 14;
        var rect = el.getBoundingClientRect();
        var availWidth = terminalContainer.clientWidth;
        var availHeight = terminalContainer.clientHeight;
        if (!rect.width || !rect.height) {
          return;
        }
        var scale = Math.min(availWidth / rect.width,
                             availHeight / rect.height);
        // Integer px keeps glyphs crisp
        var px = Math.max(MIN_FONT_PX, Math.floor(baseFont * scale));
        el.style.fontSize = px + 'px';
        // Line-height rounding can push a pixel of overflow; nudge down
        while (px > MIN_FONT_PX) {
          rect = el.getBoundingClientRect();
          if (rect.width <= availWidth && rect.height <= availHeight) {
            break;
          }
          px -= 1;
          el.style.fontSize = px + 'px';
        }
      }

      function scheduleFit() {
        if (fitScheduled) {
          return;
        }
        fitScheduled = true;
        requestAnimationFrame(function () {
          fitScheduled = false;
          fitTerminal();
        });
      }

      // The native state is authoritative whenever it changes: this
      // covers Esc and browser-UI exits, and re-syncs the class if a
      // pending requestFullscreen resolves after a rapid toggle. The
      // fallback path never fires this event, so its class handling
      // is untouched.
      function onFullscreenChange() {
        terminalContainer.classList.toggle('fullscreen',
                                           !!nativeFullscreenElement());
        scheduleFit();
      }

      fullscreenToggle.addEventListener('click', toggleFullscreen);
      window.addEventListener('resize', scheduleFit);
      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('webkitfullscreenchange', onFullscreenChange);
      document.addEventListener('keydown', function (e) {
        if (e.defaultPrevented || e.repeat ||
            e.ctrlKey || e.metaKey || e.altKey) {
          return;
        }
        if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        } else if (e.key === 'Escape' && isFullscreen() &&
                   !nativeFullscreenElement()) {
          // Fallback mode only; native fullscreen handles its own Esc
          exitFullscreen();
        }
      });
    })();
  </script>
</body>
</html>
