[package]
name = "shellshare"
version = "0.1.0"
edition = "2021"
description = "Live terminal broadcasting - server and client"
license = "Apache-2.0"

[[bin]]
name = "shellshare"
path = "src/main.rs"

[dependencies]
# Web framework (axum has better socketioxide integration)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# Static file embedding
rust-embed = { version = "8", features = ["mime-guess", "axum"] }
mime_guess = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Socket.IO
socketioxide = { version = "0.15", features = ["state"] }

# Base64 encoding for message accumulation
base64 = "0.22"

[profile.release]
lto = true
strip = true
opt-level = "z"
